services:
  garmin-mcp:
    build:
      context: .
      dockerfile: Dockerfile.remote
    container_name: garmin-mcp-remote
    ports:
      - "8000:8000"
    environment:
      - GARMIN_MCP_SERVER_URL=${GARMIN_MCP_SERVER_URL:-http://localhost:8000}
      - GARMIN_MCP_PORT=8000
      - GARMIN_MCP_HOST=0.0.0.0
      - GARMIN_MCP_PATH=/mcp
      - DB_PATH=/data/garmin_mcp.db
      - SESSION_STORAGE_PATH=/data/garmin_sessions
      # Fail-closed: with no allowlist every login is rejected, and with no
      # import secret token import is off. Set both in the shell or a .env file.
      - GARMIN_ALLOWED_EMAILS=${GARMIN_ALLOWED_EMAILS:-}
      - GARMIN_IMPORT_SECRET=${GARMIN_IMPORT_SECRET:-}
    volumes:
      - garmin-data:/data
    restart: unless-stopped

volumes:
  garmin-data:
    driver: local
