name: Security Checks

on:
  pull_request:
    branches: [ main, master ]
  schedule:
    # Run weekly on Monday at 9am UTC
    - cron: '0 9 * * 1'
  workflow_dispatch:

# Least privilege for GITHUB_TOKEN. These jobs only read the repository -- they
# never push, comment, or publish -- so anything beyond `contents: read` is blast
# radius for no benefit. Without an explicit block the token inherits the
# repository default, which can be read/write; a compromised dependency pulled
# during `uv sync` would then be running with push rights.
# (CodeQL: actions/missing-workflow-permissions)
permissions:
  contents: read

jobs:
  dependency-check:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Install uv
      uses: astral-sh/setup-uv@v7

    - name: Set up Python
      run: uv python install 3.13

    # Checked BEFORE the audit: the audit reads the lock file, so auditing a
    # lock file that no longer matches pyproject.toml would scan the wrong set.
    - name: Verify lock file is up to date
      run: |
        if ! uv lock --check; then
          echo "::error::Lock file is out of sync with pyproject.toml"
          echo "Run 'uv lock' locally and commit the updated uv.lock"
          exit 1
        fi

    # Audits the exact locked runtime set that ships in the image (the same
    # `uv export --frozen` that Dockerfile.remote installs from), not a fresh
    # resolve. --disable-pip works because the export carries hashes, so this
    # resolves nothing and audits precisely what is deployed.
    #
    # This overlaps Dependabot deliberately, and the two are not redundant:
    # Dependabot is asynchronous (alerts land in the dashboard after the fact,
    # and it opens fix PRs) and depends on GitHub's dependency graph; pip-audit
    # is synchronous, reports on the PR that introduces the problem, and reads
    # PyPI advisories directly. See OPERATIONS.md.
    #
    # Recorded exceptions -- each one a decision, with the condition that ends it:
    #
    #   PYSEC-2026-4114 (CVE-2026-49265, GHSA-xpv3-w29h-x7cv) -- oauthlib 3.3.1,
    #   fixed in 4.0.0. A timing side-channel in oauthlib's OAuth2 *authorization
    #   server* PKCE check (code_challenge_method_plain / _s256). Not reachable
    #   here: nothing in this repo imports oauthlib, and its only consumer is
    #   garth -> requests-oauthlib, which uses it as an OAuth1 *client*
    #   (OAuth1Session) for Garmin's login. No installed package calls the
    #   affected functions. This server's own OAuth endpoints come from the MCP
    #   SDK, not oauthlib.
    #   Not bumped yet because 4.0.0 is a major version on the Garmin login and
    #   token-refresh path, which CI cannot exercise (tests mock Garmin); a
    #   break there would fail every user's session refresh in production.
    #   REMOVE when garth or requests-oauthlib supports oauthlib 4 and a live
    #   login + refresh has been verified on it.
    - name: Audit locked dependencies for known vulnerabilities
      run: |
        uv export --frozen --no-dev --no-emit-project -o requirements-audit.txt
        uvx pip-audit -r requirements-audit.txt --disable-pip \
          --ignore-vuln PYSEC-2026-4114

    # A scanner that cannot fail is the placeholder this step replaced. If an
    # advisory has no fixed version available, or provably does not reach this
    # code, do NOT weaken this step -- add an explicit `--ignore-vuln <ID>`
    # above with a comment saying why and what ends it, so the exception is a
    # recorded decision rather than an invisible one.

  code-quality:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Install uv
      uses: astral-sh/setup-uv@v7

    - name: Set up Python
      run: uv python install 3.13

    - name: Install dependencies
      run: uv sync

    - name: Check Python syntax
      run: |
        uv run python -m py_compile src/garmin_mcp/*.py
        echo "✅ All Python files have valid syntax"

    - name: Check import structure
      run: |
        uv run python -c "
        import sys
        sys.path.insert(0, 'src')
        import garmin_mcp
        print('✅ Package imports successfully')
        "
