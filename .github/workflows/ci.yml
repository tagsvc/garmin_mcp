name: CI

on:
  pull_request:
    branches: [ main, master ]
  push:
    branches: [ main, master ]

# Least privilege for GITHUB_TOKEN. These jobs only read the repository -- they
# never push, comment, or publish -- so anything beyond `contents: read` is blast
# radius for no benefit. Without an explicit block the token inherits the
# repository default, which can be read/write; a compromised dependency pulled
# during `uv sync` would then be running with push rights.
# (CodeQL: actions/missing-workflow-permissions)
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ['3.12', '3.13']

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        enable-cache: true

    - name: Set up Python ${{ matrix.python-version }}
      run: uv python install ${{ matrix.python-version }}

    - name: Install dependencies
      run: uv sync

    - name: Run integration tests
      run: uv run pytest tests/integration tests/unit -v --tb=short
      timeout-minutes: 5

    - name: Test summary
      if: always()
      run: |
        echo "Tests completed for Python ${{ matrix.python-version }}"
        if [ $? -eq 0 ]; then
          echo "✅ All tests passed"
        else
          echo "❌ Some tests failed"
        fi
